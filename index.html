</style></head><body><div class="wrap" id="app"></div><script>
const KEY='cruisePackerV1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!data||typeof data!=='object')data={cruise:{name:'My Cruise'},items:[],outfits:[],other:[]};data.cruise=data.cruise||{name:'My Cruise'};data.items=data.items||[];data.outfits=data.outfits||[];data.other=data.other||[];let st={tab:'outfits',q:'',cat:'All',oq:'',oc:'All',modal:null};const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),it=id=>data.items.find(x=>x.id===id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pic=(x,i)=>x&&x.photo?`<img src="${x.photo}" alt="">`:i,ol=o=>({day:'Day',ashore:'Ashore',dinner:'Dinner',dressup:'Dress up'})[o]||'Day',oi=o=>({day:'☀️',ashore:'🏝️',dinner:'🍽️',dressup:'✨'})[o]||'👕';function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Storage is full. Try smaller photos or export your checklist.')}}
function render(){let total=data.items.length+data.other.length,p=data.items.filter(x=>x.packed).length+data.other.filter(x=>x.packed).length;document.getElementById('app').innerHTML=`<header><div class="head"><div><div class="brand">🧳 Cruise Packer</div><div class="sub">${esc(data.cruise.name||'My Cruise')} · Plan looks, pack with confidence</div></div><button class="icon" onclick="cruise()">⚙️</button></div></header><main><div class="stats"><div class="stat"><b>${data.outfits.length}</b><span>Outfits</span></div><div class="stat"><b>${data.items.length}</b><span>Wardrobe items</span></div><div class="stat"><b>${total?Math.round(p/total*100):0}%</b><span>Packed</span></div></div><div class="tabs">${[['outfits','Outfits'],['wardrobe','Wardrobe'],['other','Essentials'],['export','Export']].map(([k,v])=>`<button class="tab ${st.tab===k?'active':''}" onclick="st.tab='${k}';render()">${v}</button>`).join('')}</div>${st.tab==='outfits'?outfits():st.tab==='wardrobe'?wardrobe():st.tab==='other'?other():exports()}</main><nav class="bottom"><button onclick="outfit()">＋ Outfit</button><button onclick="addItem()">＋ Clothing</button><button onclick="addOther()">＋ Essentials</button></nav>${st.modal||''}`}
function outfits(){let s=`<div class="headrow"><h2>Your outfit plan</h2><button class="btn primary" onclick="outfit()">＋ Create</button></div><p class="hint">Choose pieces from your photographed wardrobe. Reuse favourites across several looks.</p>`;if(!data.outfits.length)return s+`<div class="empty"><div style="font-size:35px">👕 👖 👟</div><h3>Build your first look</h3><p>Add a few wardrobe photos, then combine them here.</p><button class="btn primary" onclick="outfit()">Build an outfit</button><div class="help" style="text-align:left"><strong>Quick tip</strong>Add tops, bottoms and shoes first. You can also build an outfit around a dress.</div></div>`;return s+['day','ashore','dinner','dressup'].map(o=>{let a=data.outfits.filter(x=>x.occasion===o);return a.length?`<div class="headrow"><h2>${oi(o)} ${ol(o)}</h2><span class="muted">${a.length} looks</span></div><div class="grid">${a.map(card).join('')}</div>`:''}).join('')}
function card(o){let d=it(o.dress),p=d?[d,null,it(o.shoes)]:[it(o.top),it(o.bottom),it(o.shoes)];return `<article class="outfit"><div class="look">${p.map((x,i)=>`<div class="mini">${pic(x,['👕','👖','👟'][i])}</div>`).join('')}</div><div class="outfitbody"><div class="row between"><div><div class="name">${esc(o.name)}</div><div class="occasion">${ol(o.occasion)}</div></div><button class="btn ${o.packed?'primary':'secondary'}" style="font-size:11px;padding:7px" onclick="toggleOut('${o.id}')">${o.packed?'✓ Ready':'Mark ready'}</button></div><div class="actions"><button class="btn secondary" style="flex:1" onclick="outfit('${o.id}')">Edit look</button><button class="btn danger" onclick="delOut('${o.id}')">Delete</button></div></div></article>`}
function wardrobe(){let cats=['All','Top','Bottom','Dress','Shorts','Jacket','Shoes'],a=data.items.filter(x=>(st.cat==='All'||x.category===st.cat)&&x.name.toLowerCase().includes(st.q.toLowerCase()));return `<div class="headrow"><h2>Your wardrobe</h2><button class="btn primary" onclick="addItem()">＋ Add</button></div><div class="help"><strong>Photo tip</strong>Take photos against a plain background in good light. This makes outfit combinations easier to scan.</div><input class="search" placeholder="Search clothing…" value="${esc(st.q)}" oninput="st.q=this.value;render()"><div class="filters">${cats.map(c=>`<button class="filter ${st.cat===c?'active':''}" onclick="st.cat='${c}';render()">${c}</button>`).join('')}</div>${a.length?`<div class="grid">${a.map(x=>`<article class="item"><div class="photo">${pic(x,x.category==='Shoes'?'👟':x.category==='Dress'?'👗':['Bottom','Shorts'].includes(x.category)?'👖':'👕')}</div><div class="body"><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.category)}</div><span class="badge ${x.packed?'done':''}">${x.packed?'✓ Packed':'Not packed'}</span><div class="actions"><button class="btn secondary" style="flex:1" onclick="toggleItem('${x.id}')">${x.packed?'Unpack':'Mark packed'}</button><button class="btn danger" onclick="delItem('${x.id}')">×</button></div></div></article>`).join('')}</div>`:`<div class="empty"><h3>No matching clothing</h3><p>Try another filter or add a wardrobe item.</p><button class="btn primary" onclick="addItem()">＋ Add clothing</button></div>`}`}
function other(){let cats=['All','Underwear','Toiletries','Documents','Electronics','Swimwear','Other'],a=data.other.filter(x=>(st.oc==='All'||x.category===st.oc)&&x.name.toLowerCase().includes(st.oq.toLowerCase()));return `<div class="headrow"><h2>Essentials checklist</h2><button class="btn primary" onclick="addOther()">＋ Add item</button></div><p class="hint">Underwear, toiletries, documents, electronics and everything beyond outfits.</p><input class="search" placeholder="Search essentials…" value="${esc(st.oq)}" oninput="st.oq=this.value;render()"><div class="filters">${cats.map(c=>`<button class="filter ${st.oc===c?'active':''}" onclick="st.oc='${c}';render()">${c}</button>`).join('')}</div>${a.length?`<div class="grid">${a.map(x=>`<div class="panel"><div class="row between"><div><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.category)} · Qty ${x.qty||1}</div><span class="badge ${x.packed?'done':''}">${x.packed?'✓ Packed':'Not packed'}</span></div><button class="btn ${x.packed?'primary':'secondary'}" onclick="toggleOther('${x.id}')">${x.packed?'✓':'Pack'}</button></div><div class="actions"><button class="btn danger" onclick="delOther('${x.id}')">Remove</button></div></div>`).join('')}</div>`:`<div class="empty"><div style="font-size:34px">🪥</div><h3>Your checklist starts here</h3><p>Add essentials so nothing gets forgotten.</p><button class="btn primary" onclick="addOther()">＋ Add an essential</button></div>`}`}
function exports(){let t=data.items.length+data.other.length,p=data.items.filter(x=>x.packed).length+data.other.filter(x=>x.packed).length,n=t?Math.round(p/t*100):0;return `<div class="headrow"><h2>Export & progress</h2></div><div class="panel"><div class="row between"><b>Packing checklist</b><b>${n}%</b></div><div class="progress" style="margin-top:9px"><div style="width:${n}%"></div></div><p class="hint">Each physical clothing item appears once, even if reused in multiple outfits.</p><div class="row"><button class="btn primary" style="flex:1" onclick="download()">Download TXT</button><button class="btn secondary" style="flex:1" onclick="copy()">Copy list</button></div><button class="btn secondary" style="width:100%;margin-top:8px" onclick="window.print()">Print / Save PDF</button></div><div class="help"><strong>Keep a backup</strong>Your data and photos are stored in this browser on this device, not in GitHub. Export your checklist before clearing browser data or changing phones.</div>`}
function show(s){st.modal=`<div class="modal"><section class="sheet">${s}</section></div>`;render()}function close(){st.modal=null;render()}
function cruise(){show(`<div class="sheettop"><h2>Cruise details</h2><button class="close" onclick="close()">×</button></div><p class="hint">Name your trip so it's easy to recognise.</p><div class="field"><label>Cruise name</label><input id="cn" value="${esc(data.cruise.name||'')}"></div><div class="row"><div class="field" style="flex:1"><label>Start date</label><input id="cs" type="date" value="${data.cruise.start||''}"></div><div class="field" style="flex:1"><label>End date</label><input id="ce" type="date" value="${data.cruise.end||''}"></div></div><button class="btn primary" style="width:100%" onclick="saveCruise()">Save details</button>`)}function saveCruise(){data.cruise={name:document.getElementById('cn').value,start:document.getElementById('cs').value,end:document.getElementById('ce').value};save();close()}
function addItem(){show(`<div class="sheettop"><h2>Add clothing</h2><button class="close" onclick="close()">×</button></div><div class="help"><strong>Photo tip</strong>Lay the item flat against a plain background and take the photo in good light.</div><div class="field"><label>Item name</label><input id="in" placeholder="e.g. Navy linen shirt"></div><div class="field"><label>Type</label><select id="ic">${['Top','Bottom','Dress','Shorts','Jacket','Shoes'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Photo (optional)</label><input id="ip" type="file" accept="image/*" capture="environment"></div><button class="btn primary" style="width:100%" onclick="saveItem()">Save to wardrobe</button>`)}function saveItem(){let n=document.getElementById('in').value.trim();if(!n)return alert('Enter an item name.');let f=document.getElementById('ip').files[0],c=document.getElementById('ic').value,add=photo=>{data.items.push({id:uid(),name:n,category:c,photo:photo||'',packed:false});save();close();st.tab='wardrobe';render()};if(f){let r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(f)}else add('')}
function addOther(){show(`<div class="sheettop"><h2>Add an essential</h2><button class="close" onclick="close()">×</button></div><div class="field"><label>Item name</label><input id="on" placeholder="e.g. Sunscreen"></div><div class="row"><div class="field" style="flex:1"><label>Category</label><select id="oc2">${['Underwear','Toiletries','Documents','Electronics','Swimwear','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field" style="width:95px"><label>Quantity</label><input id="oq" type="number" min="1" value="1"></div></div><button class="btn primary" style="width:100%" onclick="saveOther()">Add to checklist</button>`)}function saveOther(){let n=document.getElementById('on').value.trim();if(!n)return alert('Enter an item name.');data.other.push({id:uid(),name:n,category:document.getElementById('oc2').value,qty:Math.max(1,+document.getElementById('oq').value||1),packed:false});save();close();st.tab='other';render()}
function outfit(eid){let ex=eid?data.outfits.find(x=>x.id===eid):null,tops=data.items.filter(x=>x.category==='Top'),bots=data.items.filter(x=>['Bottom','Shorts'].includes(x.category)),dresses=data.items.filter(x=>x.category==='Dress'),shoes=data.items.filter(x=>x.category==='Shoes'),s={top:ex?.top||'',bottom:ex?.bottom||'',dress:ex?.dress||'',shoes:ex?.shoes||'',occasion:ex?.occasion||'day',name:ex?.name||''};window.sel=s;
function section(title,list,k,icon){return `<div class="picktitle">${title}</div><p class="hint">${k==='dress'?'A dress replaces the top and bottom.':k==='shoes'?'Shoes are optional.':'Tap a photo to select a piece.'}</p>${list.length?`<div class="pickgrid">${list.map(x=>`<button class="pick ${s[k]===x.id?'sel':''}" onclick="sel.${k}='${x.id}';${k==='dress'?'sel.top=\\'\\';sel.bottom=\\'\\';':''}drawOutfit()"><div class="pickphoto">${pic(x,icon)}</div><div class="pickname">${esc(x.name)}</div></button>`).join('')}</div>${s[k]?`<button class="btn secondary" style="margin-top:6px;font-size:11px" onclick="sel.${k}='';drawOutfit()">Clear selection</button>`:''}`:`<p class="muted">No ${title.toLowerCase()} yet — add it in Wardrobe first.</p>`}
window.drawOutfit=()=>{let d=it(s.dress),parts=d?[d,null,it(s.shoes)]:[it(s.top),it(s.bottom),it(s.shoes)];show(`<div class="sheettop"><div><h2>${ex?'Edit your look':'Build an outfit'}</h2><div class="hint">Pick items visually, preview, then save.</div></div><button class="close" onclick="close()">×</button></div><div class="field"><label>Outfit name</label><input id="outname" value="${esc(s.name)}" placeholder="e.g. Port Vila exploring"></div><div class="picktitle">What is this outfit for?</div><div class="chips">${['day','ashore','dinner','dressup'].map(o=>`<button class="chip ${s.occasion===o?'sel':''}" onclick="sel.occasion='${o}';drawOutfit()">${oi(o)} ${ol(o)}</button>`).join('')}</div><div class="help"><strong>Need inspiration?</strong>Suggest outfit picks a random combination from your wardrobe. Shuffle tries another one. You can change pieces before saving.</div><div class="suggest"><button class="btn secondary" onclick="suggest()">✨ Suggest outfit</button><button class="btn secondary" onclick="suggest()">🔀 Shuffle</button></div><div class="preview"><b>Your look preview</b><div class="previewlook">${parts.map((x,i)=>`<div class="previewcell">${pic(x,['👕','👖','👟'][i])}</div>`).join('')}</div><div class="muted" style="margin-top:7px">${[d?.name,it(s.top)?.name,it(s.bottom)?.name,it(s.shoes)?.name].filter(Boolean).join(' · ')||'Selected pieces will appear here'}</div></div>${section('1. Tops',tops,'top','👕')}${section('2. Bottoms / shorts',bots,'bottom','👖')}${section('Or choose a dress',dresses,'dress','👗')}${section('3. Shoes (optional)',shoes,'shoes','👟')}<p class="footnote">The same item can appear in multiple looks, but only needs to be packed once.</p><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveOutfit()">Save outfit</button>`)}
window.suggest=()=>{if(!tops.length&&!bots.length&&!dresses.length&&!shoes.length)return alert('Add clothing to your wardrobe first.');s.dress='';s.top=tops.length?tops[Math.floor(Math.random()*tops.length)].id:'';s.bottom=bots.length?bots[Math.floor(Math.random()*bots.length)].id:'';s.shoes=shoes.length?shoes[Math.floor(Math.random()*shoes.length)].id:'';if(dresses.length&&Math.random()<.25){s.dress=dresses[Math.floor(Math.random()*dresses.length)].id;s.top='';s.bottom=''}drawOutfit()};
window.saveOutfit=()=>{let n=document.getElementById('outname')?.value.trim()||ol(s.occasion)+' outfit';if(!s.dress&&(!s.top||!s.bottom))return alert('Choose a top and bottom, or choose a dress.');if(ex)Object.assign(ex,{name:n,occasion:s.occasion,top:s.top,bottom:s.bottom,dress:s.dress,shoes:s.shoes});else data.outfits.push({id:uid(),name:n,occasion:s.occasion,top:s.top,bottom:s.bottom,dress:s.dress,shoes:s.shoes,packed:false});save();close();st.tab='outfits';render()};drawOutfit()}
function toggleItem(i){let x=it(i);x.packed=!x.packed;save();render()}function delItem(i){if(confirm('Remove this wardrobe item?')){data.items=data.items.filter(x=>x.id!==i);save();render()}}function toggleOther(i){let x=data.other.find(x=>x.id===i);x.packed=!x.packed;save();render()}function delOther(i){if(confirm('Remove this item?')){data.other=data.other.filter(x=>x.id!==i);save();render()}}function toggleOut(i){let x=data.outfits.find(x=>x.id===i);x.packed=!x.packed;save();render()}function delOut(i){if(confirm('Delete this outfit?')){data.outfits=data.outfits.filter(x=>x.id!==i);save();render()}}
function listText(){let s=`CRUISE PACKING LIST\n${data.cruise.name||'My Cruise'}\n\n`;['day','ashore','dinner','dressup'].forEach(o=>{let a=data.outfits.filter(x=>x.occasion===o);if(a.length){s+=ol(o).toUpperCase()+' OUTFITS\n';a.forEach(x=>s+=`- ${x.name}: ${[x.dress?it(x.dress)?.name:it(x.top)?.name,it(x.bottom)?.name,it(x.shoes)?.name].filter(Boolean).join(', ')}\n`);s+='\n'}});s+='CLOTHING / SHOES\n';data.items.forEach(x=>s+=`[${x.packed?'x':' '}] ${x.name} (${x.category})\n`);s+='\nESSENTIALS\n';data.other.forEach(x=>s+=`[${x.packed?'x':' '}] ${x.name} (${x.category}) x${x.qty||1}\n`);return s}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([listText()],{type:'text/plain'}));a.download='cruise-packing-list.txt';a.click()}async function copy(){try{await navigator.clipboard.writeText(listText());alert('Checklist copied.')}catch(e){alert('Use Download TXT if copy is unavailable.')}}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></div></body></html>
